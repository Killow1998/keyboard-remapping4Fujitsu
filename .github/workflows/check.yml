name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-0t64
      - name: Install Rust
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt
      - name: Formatting
        run: cargo +1.93.1 fmt --all -- --check
      - name: Backend tests
        run: cargo +1.93.1 test --locked
      - name: Build
        run: cargo +1.93.1 build --release --locked
